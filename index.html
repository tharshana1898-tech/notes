<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dandelune</title>
<meta name="description" content="A dreamy little notebook with folders, paper styles and stickers. Your notes stay on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dandelune">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#edf1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b24" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Caveat:wght@400;600&family=Gaegu:wght@400;700&family=Indie+Flower&family=Pacifico&family=Fredoka:wght@400;600&family=Dancing+Script:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: a stationery drawer on the left (folders + note cards), a single sheet of real-feeling paper on the right; one pane at a time on phones.
   Palette "moonlit meadow": sage mist ground, dusk-blue accent, dandelion yellow as the small spark. */
:root{
  --bg:#edf1ec; --surface:#fbfcf9; --surface-2:#e2e8e1; --ink:#2c3a3e; --muted:#6c7c7d;
  --accent:#4f60a6; --accent-soft:#dde2f3; --line-ui:#d7dfd6; --spark:#e4b33f; --shadow:rgba(40,60,70,.12);
  --f-display:'Shantell Sans','Comic Sans MS','Nunito',system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b24; --surface:#1e2632; --surface-2:#273140; --ink:#e7ecf1; --muted:#97a4b2;
  --accent:#a7b4ff; --accent-soft:#2a3354; --line-ui:#323d4d; --spark:#f0c65a; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b24; --surface:#1e2632; --surface-2:#273140; --ink:#e7ecf1; --muted:#97a4b2;
  --accent:#a7b4ff; --accent-soft:#2a3354; --line-ui:#323d4d; --spark:#f0c65a; --shadow:rgba(0,0,0,.4); color-scheme:dark}

[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}

.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:1fr;gap:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px}
.lib,.ed-pane{min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain}
@media (max-width:859px){
  .app[data-view="library"] .ed-pane{display:none}
  .app[data-view="editor"] .lib{display:none}
}
@media (min-width:860px){
  .app{grid-template-columns:320px minmax(0,1fr)}
  #back{display:none}
}

/* ---------- library ---------- */
.lib{display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;white-space:nowrap;letter-spacing:-.2px;line-height:1}
.brand h1::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--spark);margin-left:3px;vertical-align:4px}
.status{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status[data-s="err"]{background:var(--accent-soft);color:var(--accent)}
.search input{width:100%;box-sizing:border-box;border:2px solid var(--line-ui);background:var(--surface);border-radius:14px;padding:10px 14px}
.search input:focus{border-color:var(--accent);outline:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sec-head h2{font-family:var(--f-display);font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:0;font-weight:400}
.pill{border:0;background:var(--accent-soft);color:var(--accent);font-weight:800;border-radius:99px;padding:6px 12px;font-size:13px}
.pill:hover{filter:brightness(.97)}

#tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.frow{display:flex;align-items:center;padding-left:calc(var(--d,0) * 18px)}
.fsel{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:12px}
.frow[data-sel="1"] .fsel{background:var(--surface);box-shadow:0 2px 0 var(--line-ui)}
.fsel:hover{background:var(--surface)}
.fico{width:20px;height:15px;border-radius:3px 4px 4px 4px;background:var(--fc,#c9d8b6);position:relative;flex:none;margin-top:3px;border:1.5px solid rgba(44,58,62,.45)}
.fico::before{content:"";position:absolute;left:-1.5px;top:-6px;width:9px;height:5px;border-radius:3px 3px 0 0;background:var(--fc,#c9d8b6);border:1.5px solid rgba(44,58,62,.45);border-bottom:0}
.fico.all{background:var(--surface-2)}.fico.all::before{background:var(--surface-2)}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.fcount{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmore{border:0;background:none;width:32px;height:32px;border-radius:10px;color:var(--muted);font-weight:800;flex:none}
.fmore:hover{background:var(--surface)}
.frename{flex:1;min-width:0;border:2px solid var(--accent);border-radius:10px;padding:6px 10px;background:var(--surface);margin:2px 0}
.fmenu{margin:2px 0 8px calc(var(--d,0) * 18px + 8px);background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 4px 14px var(--shadow)}
.fmenu .txt{border:0;background:var(--surface-2);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.fmenu .danger{color:var(--accent)}
.fmenu .msg{flex-basis:100%;font-size:13px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-ui);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--accent)}

#noteList{display:flex;flex-direction:column;gap:10px}
.ncard{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 2px 0 var(--line-ui)}
.ncard:hover{transform:translateY(-1px)}
.ncard[data-sel="1"]{box-shadow:0 0 0 2.5px var(--accent)}
.mini{width:40px;height:52px;flex:none;border-radius:4px;box-shadow:0 1px 3px var(--shadow);background-color:var(--pbg)}
.mini[data-pattern="lined"]{background-image:repeating-linear-gradient(transparent 0 7px,var(--pline) 7px 8px)}
.mini[data-pattern="grid"]{background-image:linear-gradient(var(--pline) 1px,transparent 1px),linear-gradient(90deg,var(--pline) 1px,transparent 1px);background-size:8px 8px}
.mini[data-pattern="dots"]{background-image:radial-gradient(circle,var(--pline) 1px,transparent 1.4px);background-size:8px 8px}
.nbody{min-width:0;flex:1}
.ntitle{font-weight:800;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nsnip{font-size:13px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{font-size:12px;color:var(--muted);margin-top:4px}
.empty-note{color:var(--muted);font-size:14px;padding:14px;border:2px dashed var(--line-ui);border-radius:16px;text-align:center}

.welcome{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 18px var(--shadow)}
.welcome h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.welcome p{margin:0;color:var(--muted)}
.welcome .stks{display:flex;gap:6px}
.welcome .stks img{width:40px;height:40px}
.welcome .row{display:flex;gap:8px;flex-wrap:wrap}
.big{border:0;border-radius:14px;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--surface)}
.big.alt{background:var(--surface-2);color:var(--ink)}
.safe{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 var(--line-ui)}
.safe .sec-head{margin:0}
.safe-note{margin:0;font-size:13px;color:var(--muted)}
.safe .row,.welcome .row{display:flex;gap:8px;flex-wrap:wrap}
.safe .big{padding:9px 12px;font-size:13px}
.banner{background:var(--accent-soft);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}
.banner .big{padding:8px 12px;font-size:13px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px var(--shadow)}

/* ---------- editor ---------- */
.ed-pane{position:relative}
.ed-empty{height:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center}
.ed-empty img{width:90px;height:90px}
.ed-empty p{margin:0;font-family:var(--f-display);font-size:18px}
.ed-head{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:8px;display:flex;flex-direction:column;gap:8px}
.ed-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#back{border:0;background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:800}
#title{flex:1 1 180px;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:24px;font-weight:800;padding:4px 2px;border-bottom:2px dashed transparent}
#title:focus{outline:none;border-bottom-color:var(--accent)}
#title::placeholder{color:var(--muted)}
.ed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.ed-meta select{border:2px solid var(--line-ui);background:var(--surface);border-radius:10px;padding:5px 8px;max-width:180px}
#delNote{margin-left:auto;border:0;background:none;color:var(--muted);font-weight:700;padding:6px 8px;border-radius:10px}
#delNote[data-armed="1"]{background:var(--accent);color:var(--surface)}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--surface);border-radius:16px;box-shadow:0 2px 10px var(--shadow);scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tb{flex:none;border:0;background:none;min-width:38px;height:38px;border-radius:11px;padding:0 10px;font-weight:800;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tb:hover{background:var(--surface-2)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tb svg{width:18px;height:18px}
.sep{flex:none;width:1.5px;background:var(--line-ui);margin:6px 2px}
.panel{background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 6px 20px var(--shadow);display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.panel{animation:pop .18s ease-out}}
@keyframes pop{from{transform:translateY(-4px);opacity:.6}to{transform:none;opacity:1}}
.panel h3{margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800}
.panel .hint{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line-ui);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:18px;line-height:1.2}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip.sm{font-size:13px;font-weight:700}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.stk-btn{border:0;background:var(--surface-2);border-radius:14px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;padding:6px}
.stk-btn img{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.stk-btn:hover img{transform:rotate(-8deg) scale(1.08);transition:transform .15s}}
.opt-grid{display:flex;flex-wrap:wrap;gap:10px}
.opt{border:2px solid var(--line-ui);background:var(--surface);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;width:72px}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt .mini{width:44px;height:52px}
.opt .bprev{width:44px;height:52px;position:relative;border-radius:4px;background:#fffdf8;box-shadow:0 1px 3px var(--shadow)}
.opt .bprev .frame{inset:4px}
.opt .bprev .frame.tiles{background-size:10px 10px}
.psw{width:34px;height:34px;border-radius:10px;border:2px solid var(--line-ui);padding:0}
.psw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.ink{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-ui);padding:0}
.ink.none{background:repeating-linear-gradient(45deg,var(--surface) 0 4px,var(--line-ui) 4px 6px)}

/* ---------- paper ---------- */
.paper-wrap{padding:6px 0 60px}
.paper{--pady:44px;--padx:46px;position:relative;max-width:780px;margin:0 auto;background:var(--pbg,#fffdf8);border-radius:6px;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px var(--shadow);min-height:560px;display:flex}
@media (max-width:500px){.paper{--padx:36px;--pady:40px;min-height:480px}}
.ed{flex:1;min-width:0;position:relative;padding:var(--pady) var(--padx);color:var(--pink-ink,#4b3546);line-height:32px;outline:none;
  overflow-wrap:anywhere;caret-color:var(--pacc,#e0567a);background-repeat:repeat;background-position:0 var(--pady)}
.paper[data-pattern="lined"] .ed{background-image:linear-gradient(transparent 31px,var(--pline) 31px);background-size:100% 32px}
.paper[data-pattern="lined"]::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--padx) - 12px);width:1.5px;background:var(--pmargin);z-index:1;pointer-events:none}
.paper[data-pattern="grid"] .ed{background-image:linear-gradient(transparent 31px,var(--pline) 31px),linear-gradient(90deg,transparent 31px,var(--pline) 31px);background-size:32px 32px}
.paper[data-pattern="dots"] .ed{background-image:radial-gradient(circle at 0 31.5px,var(--pdot) 1.6px,transparent 2px);background-size:24px 32px}
.ed:empty::before{content:attr(data-ph);color:var(--pline-strong);pointer-events:none}
.ed > div,.ed p{margin:0;min-height:32px}
.ed h2{margin:0;font-size:1.7em;line-height:64px;font-weight:700}
.ed h3{margin:0;font-size:1.25em;line-height:32px;color:var(--pacc);text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:6px}
.ed ul,.ed ol{margin:0;padding-left:28px}
.ed li{list-style:none;position:relative}
.ed li::before{content:"\2726";position:absolute;left:-22px;color:var(--pacc);font-size:.8em}
.ed ol{counter-reset:n}.ed ol li{counter-increment:n}.ed ol li::before{content:counter(n) ".";font-size:.9em}
.ed b,.ed strong{font-weight:700}
.stk{display:inline-block;vertical-align:-7px;height:30px;width:auto;margin:0 2px;user-select:none}
.stk.stk-s{height:22px;vertical-align:-4px}
.stk.stk-l{height:62px;vertical-align:-12px}
.chk{display:inline-block;width:19px;height:19px;border:2px solid var(--pacc);border-radius:6px;vertical-align:-3px;cursor:pointer;background:transparent;position:relative;user-select:none}
.chk[data-on="1"]{background:var(--pacc)}
.chk[data-on="1"]::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}

.frame{position:absolute;inset:10px;pointer-events:none;z-index:2;border-radius:4px}
.frame.tiles{background-repeat:repeat-x,repeat-x,repeat-y,repeat-y;background-position:left top,left bottom,left top,right top;background-size:20px 20px}
.frame[data-b="stitch"]{inset:12px;border:2.5px dashed var(--pacc);border-radius:12px}
.frame[data-b="doodle"]{inset:12px;border:3px solid var(--pacc);border-radius:255px 18px 225px 18px/18px 225px 18px 255px}
.frame[data-b="washi"]::before,.frame[data-b="washi"]::after{content:"";position:absolute;top:-14px;width:96px;height:26px;opacity:.85;
  background:repeating-linear-gradient(90deg,var(--pacc) 0 8px,rgba(255,255,255,.65) 8px 16px)}
.frame[data-b="washi"]::before{left:-24px;transform:rotate(-32deg)}
.frame[data-b="washi"]::after{right:-24px;transform:rotate(32deg)}
.opt .bprev .frame[data-b="washi"]::before,.opt .bprev .frame[data-b="washi"]::after{width:30px;height:9px;top:-5px}
.opt .bprev .frame[data-b="washi"]::before{left:-8px}.opt .bprev .frame[data-b="washi"]::after{right:-8px}
.opt .bprev .frame[data-b="stitch"],.opt .bprev .frame[data-b="doodle"]{inset:5px;border-width:1.5px}

/* ---------- v2 additions ---------- */
.panel{max-height:min(46vh,430px);overflow-y:auto;overscroll-behavior:contain}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:-14px;background:var(--surface);margin:-14px -14px -4px;padding:12px 14px 6px;z-index:1}
.p-head h3{margin:0}
.p-done{border:0;background:var(--surface-2);border-radius:99px;padding:7px 14px;font-weight:800;font-size:13px}
.p-done:hover{filter:brightness(.97)}
.stk-sec{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stk-btn{position:relative}
.stk-btn.make{border:2px dashed var(--line-ui);background:var(--surface);color:var(--accent);font-weight:800;font-size:12px;line-height:1.1;text-align:center}
.stk-btn.make b{display:block;font-size:22px;line-height:1}
.stk-btn .x{position:absolute;top:-5px;right:-5px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 4px var(--shadow)}
.stk-btn img{object-fit:contain}

.install{background:var(--accent-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.install h2{font-family:var(--f-display);font-size:16px;margin:0;color:var(--ink)}
.install p{margin:0;font-size:13px;color:var(--ink);opacity:.85}
.install .row{display:flex;gap:8px;flex-wrap:wrap}
.install .big{padding:9px 14px;font-size:13px}

.toast{display:flex;gap:12px;align-items:center}
.toast[hidden]{display:none}
.toast button{border:0;background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font-weight:800;flex:none}

/* sticker maker */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,28,34,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.modal{align-items:center;padding:16px}}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:100%;overflow-y:auto;border-radius:22px 22px 0 0;box-sizing:border-box;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:600px){.sheet{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{font-family:var(--f-display);font-size:20px;margin:0}
.pad{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border-radius:16px;overflow:hidden;
  background:conic-gradient(#ececec 25%,#fafafa 0 50%,#ececec 0 75%,#fafafa 0) 0 0/24px 24px;box-shadow:inset 0 0 0 2px var(--line-ui)}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tool{border:2px solid var(--line-ui);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;min-height:36px}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pen{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-ui);padding:0}
.pen[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.dot{display:inline-block;border-radius:50%;background:currentColor;vertical-align:middle}
.sheet input[type="text"]{border:2px solid var(--line-ui);border-radius:12px;padding:9px 12px;background:var(--surface);width:100%;box-sizing:border-box}
.sheet input[type="text"]:focus{border-color:var(--accent);outline:none}
.check-row{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}
.check-row input{width:18px;height:18px;accent-color:var(--accent)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lbl{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0}
</style>
<script src="app.js" defer></script>
</head>
<body>
<div class="app" id="app" data-view="library">
  <aside class="lib" id="lib">
    <div class="brand">
      <img id="logo" alt="">
      <h1>Dandelune</h1>
      <span class="status" id="status">Opening…</span>
    </div>
    <div id="libBody"></div>
  </aside>

  <main class="ed-pane" id="edPane">
    <div class="ed-empty" id="edEmpty">
      <img id="emptyArt" alt="">
      <p>Pick a note, or start a fresh page</p>
    </div>
    <div id="edWrap" hidden>
      <div class="ed-head">
        <div class="ed-top">
          <button id="back" type="button">‹ Notes</button>
          <input id="title" placeholder="Untitled page" maxlength="120" autocomplete="off">
        </div>
        <div class="ed-meta">
          <label for="moveTo">In</label>
          <select id="moveTo"></select>
          <button id="delNote" type="button">Delete page</button>
        </div>
        <div class="toolbar" id="tb" role="toolbar" aria-label="Writing tools">
          <button class="tb" data-panel="style" aria-pressed="false" type="button" title="Writing style"><span style="font-family:'Dancing Script',cursive;font-weight:700;font-size:17px">Aa</span> Style</button>
          <button class="tb" data-panel="color" aria-pressed="false" type="button" title="Ink and highlighter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M4 22h16" stroke-width="3" stroke="#e4b33f"/></svg>Color</button>
          <span class="sep"></span>
          <button class="tb" data-cmd="bold" aria-pressed="false" type="button" title="Bold"><b>B</b></button>
          <button class="tb" data-cmd="italic" aria-pressed="false" type="button" title="Italic"><i style="font-family:Georgia,serif">I</i></button>
          <button class="tb" data-cmd="underline" aria-pressed="false" type="button" title="Underline"><u>U</u></button>
          <span class="sep"></span>
          <button class="tb" data-cmd="h2" type="button" title="Heading">Heading</button>
          <button class="tb" data-cmd="h3" type="button" title="Subheading">Subheading</button>
          <button class="tb" data-cmd="list" type="button" title="Star bullet list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10"/><circle cx="5" cy="6" r="1.4" fill="currentColor"/><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="5" cy="18" r="1.4" fill="currentColor"/></svg></button>
          <button class="tb" data-cmd="check" type="button" title="Add a checkbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12l3 3 5-6"/></svg></button>
          <span class="sep"></span>
          <button class="tb" data-panel="sticker" aria-pressed="false" type="button" title="Stickers"><img id="tbStk" alt="" style="width:22px;height:22px">Stickers</button>
          <button class="tb" data-panel="page" aria-pressed="false" type="button" title="Paper and border"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Page</button>
        </div>
        <div class="panel" id="panel" hidden></div>
      </div>
      <div class="paper-wrap">
        <div class="paper" id="paper">
          <div class="frame" id="frame"></div>
          <div class="ed" id="ed" contenteditable="true" spellcheck="true" data-ph="Start writing…" aria-label="Note page"></div>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
